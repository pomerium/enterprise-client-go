name: Dependabot

on:
  pull_request:

jobs:
  generate:
    if: ${{ github.actor == 'dependabot[bot]' }}
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          owner: pomerium
          repositories: enterprise-client-go,pomerium-console
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          submodules: "true"
          token: ${{ steps.ci-token.outputs.token }}
          persist-credentials: false

      - name: Generate
        run: make generate

      - name: Create CI write token
        id: ci-write-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Commit
        uses: devops-infra/action-commit-push@f066ea8e19660de57d3d3a4a0b9d294ea2612e20
        with:
          github_token: ${{ steps.ci-write-token.outputs.token }}
          commit_message: "dependabot: generate"

  build:
    if: ${{ github.actor == 'dependabot[bot]' }}
    name: Build
    needs: generate
    uses: ./.github/workflows/reusable-build.yaml
    with:
      ref: ${{ github.head_ref }}
